{% extends "base.html" %}
{% block content %}
<h1>Recommend by Song</h1>
<form method="POST">
    <select name="song">
        {% for song in songs %}
        <option value="{{ song }}">{{ song }}</option>
        {% endfor %}
    </select>
    <button type="submit">Recommend</button>
</form>
<ul>
    {% for recommendation in recommendations %}
    <li>{{ recommendation }}</li>
    {% endfor %}
</ul>
{% endblock %}
