{% extends "base.html" %}
{% block content %}
<h1>Recommend by Song</h1>
<form method="POST">
    <label for="song">Select a Song:</label>
    <select id="song" name="song">
        {% for song in songs %}
        <option value="{{ song }}">{{ song }}</option>
        {% endfor %}
    </select>
    <button type="submit">Recommend</button>
</form>

{% if recommendations %}
<h2>Recommended Songs:</h2>
<ul>
    {% for rec in recommendations %}
    <li>{{ rec }}</li>
    {% endfor %}
</ul>
{% endif %}
{% endblock %}
